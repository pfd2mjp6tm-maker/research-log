<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#ffffff">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="Research Log">

<link rel="apple-touch-icon"
      href="B56F0F83-2A26-41C1-8CC0-009FF991AFB1.jpeg">

<link rel="manifest"
      href="manifest.json">

<title>Research Log</title>

<link rel="stylesheet"
      href="style.css">

</head>


<body>


<div class="app">


    <!-- =========================
         Header
    ========================== -->

    <header class="header">

        <h1>Research Log</h1>

        <p>
            Your research memory
        </p>

    </header>



    <!-- =========================
         Calendar
    ========================== -->

    <main class="calendar-container">


        <div class="calendar-header">

            <button id="prevMonth">
                ‹
            </button>


            <h2 id="monthTitle">
                2026年8月
            </h2>


            <button id="nextMonth">
                ›
            </button>

        </div>



        <div class="weekdays">

            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>

        </div>



        <div
            id="calendar"
            class="calendar">
        </div>



        <!-- =========================
             Tag Legend
        ========================== -->

        <div class="tag-legend">

            <h3>
                Tags
            </h3>

            <div id="tagLegend">
            </div>

        </div>


    </main>



    <!-- =========================
         Bottom Navigation
    ========================== -->

    <nav class="bottom-nav">


        <button
            class="nav-button active"
            id="calendarButton">

            📅

            <span>
                Calendar
            </span>

        </button>


        <button
            class="nav-button"
            id="searchButton">

            🔎

            <span>
                Search
            </span>

        </button>


        <button
            class="nav-button"
            id="summaryButton">

            📊

            <span>
                Summary
            </span>

        </button>


    </nav>


</div>



<!-- =========================
     Log Modal
========================== -->

<div
    id="logModal"
    class="modal">


    <div class="modal-content">


        <!-- Modal Header -->

        <div class="modal-header">


            <button
                id="closeModal"
                class="close-button">

                ×

            </button>


            <h2 id="selectedDate">
                2026/8/28
            </h2>


        </div>



        <!-- Log Form -->

        <div class="log-form">


            <!-- =========================
                 What did you do?
            ========================== -->

            <label>
                何をした？
            </label>

            <textarea
                id="action"
                placeholder="今日やったことを入力">
            </textarea>



            <!-- =========================
                 Purpose
            ========================== -->

            <label>
                目的
            </label>

            <textarea
                id="purpose"
                placeholder="何のために？">
            </textarea>



            <!-- =========================
                 Result
            ========================== -->

            <label>
                結果
            </label>

            <textarea
                id="result"
                placeholder="どうだった？">
            </textarea>



            <!-- =========================
                 Thought
            ========================== -->

            <label>
                考察・気づき
            </label>

            <textarea
                id="thought"
                placeholder="何が分かった？何を考えた？">
            </textarea>



            <!-- =========================
                 Next
            ========================== -->

            <label>
                次に活かすこと
            </label>

            <textarea
                id="next"
                placeholder="次に何をする？">
            </textarea>



            <!-- =========================
                 Main Tag
            ========================== -->

            <label>
                メインタグ
            </label>


            <div class="main-tag-area">


                <select id="mainTag">

                    <option value="">
                        タグを選択
                    </option>

                </select>


                <button
                    type="button"
                    id="addTagButton"
                    class="small-button">

                    ＋

                </button>


            </div>



            <!-- =========================
                 Tag Color
            ========================== -->

            <label>
                タグカラー
            </label>


            <div
                id="colorPicker"
                class="color-picker">


                <button
                    type="button"
                    class="color-option"
                    data-color="#75BFE6"
                    style="background:#75BFE6">
                </button>


                <button
                    type="button"
                    class="color-option"
                    data-color="#7BCFA6"
                    style="background:#7BCFA6">
                </button>


                <button
                    type="button"
                    class="color-option"
                    data-color="#B39DDB"
                    style="background:#B39DDB">
                </button>


                <button
                    type="button"
                    class="color-option"
                    data-color="#F2A65A"
                    style="background:#F2A65A">
                </button>


                <button
                    type="button"
                    class="color-option"
                    data-color="#E98B8B"
                    style="background:#E98B8B">
                </button>


                <button
                    type="button"
                    class="color-option"
                    data-color="#F2D66B"
                    style="background:#F2D66B">
                </button>


            </div>



            <!-- =========================
                 Sub Tags
            ========================== -->

            <label>
                その他のタグ
            </label>


            <input
                type="text"
                id="tags"
                placeholder="#加速試験 #安定性 #ブランク">



            <!-- =========================
                 Save
            ========================== -->

            <button
                id="saveButton"
                class="save-button">

                ログを完了

            </button>


        </div>


    </div>


</div>



<!-- =========================
     Tag Modal
========================== -->

<div
    id="tagModal"
    class="modal">


    <div class="modal-content">


        <div class="modal-header">


            <button
                id="closeTagModal"
                class="close-button">

                ×

            </button>


            <h2>
                新しいタグ
            </h2>


        </div>



        <div class="log-form">


            <label>
                タグ名
            </label>


            <input
                type="text"
                id="newTagName"
                placeholder="#R2試薬">


            <label>
                色
            </label>


            <div
                id="newTagColorPicker"
                class="color-picker">


                <button
                    type="button"
                    class="new-color-option color-option"
                    data-color="#75BFE6"
                    style="background:#75BFE6">
                </button>


                <button
                    type="button"
                    class="new-color-option color-option"
                    data-color="#7BCFA6"
                    style="background:#7BCFA6">
                </button>


                <button
                    type="button"
                    class="new-color-option color-option"
                    data-color="#B39DDB"
                    style="background:#B39DDB">
                </button>


                <button
                    type="button"
                    class="new-color-option color-option"
                    data-color="#F2A65A"
                    style="background:#F2A65A">
                </button>


                <button
                    type="button"
                    class="new-color-option color-option"
                    data-color="#E98B8B"
                    style="background:#E98B8B">
                </button>


                <button
                    type="button"
                    class="new-color-option color-option"
                    data-color="#F2D66B"
                    style="background:#F2D66B">
                </button>


            </div>



            <button
                id="saveTagButton"
                class="save-button">

                タグを保存

            </button>


        </div>


    </div>


</div>



<script src="script.js"></script>


</body>

</html>
