<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#ffffff">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="Research Log">

<title>Research Log</title>

<link rel="manifest"
      href="manifest.json">

<link rel="stylesheet"
      href="style.css">

</head>


<body>


<div class="app">


    <!-- =========================
         Header
    ========================== -->

    <header class="header">

        <h1>Research Log</h1>

        <p>
            Your research memory
        </p>

    </header>



    <!-- =========================
         Calendar
    ========================== -->

    <main class="calendar-container">


        <div class="calendar-header">

            <button
                id="prevMonth"
                type="button">

                ‹

            </button>


            <h2 id="monthTitle">
                2026年9月
            </h2>


            <button
                id="nextMonth"
                type="button">

                ›

            </button>

        </div>



        <div class="weekdays">

            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>

        </div>



        <div
            id="calendar"
            class="calendar">
        </div>


    </main>



    <!-- =========================
         Bottom Navigation
    ========================== -->

    <nav class="bottom-nav">


        <button
            class="nav-button active"
            id="calendarButton"
            type="button">

            📅

            <span>
                Calendar
            </span>

        </button>


        <button
            class="nav-button"
            id="searchButton"
            type="button">

            🔎

            <span>
                Search
            </span>

        </button>


        <button
            class="nav-button"
            id="summaryButton"
            type="button">

            📊

            <span>
                Summary
            </span>

        </button>


    </nav>


</div>



<!-- =========================
     Log Modal
========================== -->

<div
    id="logModal"
    class="modal">


    <div class="modal-content">


        <!-- =========================
             Modal Header
        ========================== -->

        <div class="modal-header">


            <button
                id="closeModal"
                class="close-button"
                type="button">

                ×

            </button>


            <h2 id="selectedDate">
                2026/9/8
            </h2>


        </div>



        <!-- =========================
             Existing Logs
        ========================== -->

        <div
            id="logList"
            class="log-list">
        </div>



        <!-- =========================
             Add Log Button
        ========================== -->

        <div
            id="addLogArea"
            class="add-log-area">

            <button
                id="addLogButton"
                class="add-log-button"
                type="button">

                ＋ 研究ログを追加

            </button>

        </div>



        <!-- =========================
             Log Form
        ========================== -->

        <div
            id="logForm"
            class="log-form"
            style="display: none;">


            <label>
                何をした？
            </label>

            <textarea
                id="action"
                placeholder="今日やったことを入力">
            </textarea>



            <label>
                目的
            </label>

            <textarea
                id="purpose"
                placeholder="何のために？">
            </textarea>



            <label>
                結果
            </label>

            <textarea
                id="result"
                placeholder="どうだった？">
            </textarea>



            <label>
                考察・気づき
            </label>

            <textarea
                id="thought"
                placeholder="何が分かった？何を考えた？">
            </textarea>



            <label>
                次に活かすこと
            </label>

            <textarea
                id="next"
                placeholder="次に何をする？">
            </textarea>



            <label>
                タグ
            </label>

            <input
                type="text"
                id="tags"
                placeholder="#R2試薬 #加速試験">



            <button
                id="saveButton"
                class="save-button"
                type="button">

                保存する

            </button>


        </div>


    </div>


</div>



<!-- =========================
     Return Choice Modal
========================== -->

<div
    id="returnModal"
    class="choice-modal">


    <div class="choice-modal-content">


        <h2>
            どこに戻りますか？
        </h2>


        <p id="returnMessage">
            戻り先を選択してください。
        </p>



        <button
            id="returnToLogs"
            type="button"
            class="choice-button">

            📋 この日のログを見る

        </button>



        <button
            id="returnToCalendar"
            type="button"
            class="choice-button">

            📅 カレンダーに戻る

        </button>



        <button
            id="cancelReturn"
            type="button"
            class="cancel-button">

            キャンセル

        </button>


    </div>


</div>



<script src="script.js"></script>

</body>

</html>
